name: mcro
description: "mcro - create and run micro-apps built with HTML, CSS, and JavaScript."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Pinned for reproducible CI builds; 4.14+ requires Flutter 3.38+/Dart 3.10.
  webview_flutter: 4.10.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
